<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addition</title>
</head>
<body>
    <input type="number" id="num1">
    <br>
    <br>
    <input type="number" id="num2">
    <button onclick="add()">+</button>
    <br>
    <br>
    <button onclick="sub()">-</button>
    <br>
    <br>
    <button onclick="mul()">*</button>
    <br>
    <br>
    <button onclick="div()">/</button>
    <br>
    <br>
    <h4 id="ans">0</h4>

    <script>
        function add() 
        {
            let bhav1 = document.getElementById("num1").value;
            let bhav2 = document.getElementById("num2").value;

            let result = Number(bhav1) + Number(bhav2);

            document.getElementById("ans").innerHTML = result;
        }

        function sub() 
        {
            let bhav1 = document.getElementById("num1").value;
            let bhav2 = document.getElementById("num2").value;

            let result = Number(bhav1) - Number(bhav2);

            document.getElementById("ans").innerHTML = result;
        }

        function mul() 
        {
            let bhav1 = document.getElementById("num1").value;
            let bhav2 = document.getElementById("num2").value;

            let result = Number(bhav1) * Number(bhav2);

            document.getElementById("ans").innerHTML = result;
        }

        function div() 
        {
            let bhav1 = document.getElementById("num1").value;
            let bhav2 = document.getElementById("num2").value;

            let result = Number(bhav1) / Number(bhav2);

            document.getElementById("ans").innerHTML = result;
        }
    </script>
</body>
</html>
